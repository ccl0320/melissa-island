<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>Melissa 的小島</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: full-bleed 3D island; paper-white floating cards (title top-left, icon menu top-right, big picture action bar bottom) built for a first grader who reads pictures, not words */
:root {
  --sea: #2b5785;
  --ink: #2a2d44;
  --muted: #6f7290;
  --paper: #fbf9fc;
  --card: rgba(251, 249, 252, 0.94);
  --line: #e4dfea;
  --accent: #e0603a;
  --accent-soft: #fbe3da;
  --accent-ink: #ffffff;
  --leaf: #3f9d6a;
  --leaf-soft: #e3f4ea;
  --gold: #f2b84b;
  --gold-soft: #fff4dc;
  --shadow: 0 6px 20px rgba(20, 30, 60, 0.18);
  --f-display: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-num: "Fredoka", "Noto Sans TC", system-ui, sans-serif;
  --f-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--sea); color: var(--ink); font-family: var(--f-display); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.em { font-family: var(--f-emoji); font-style: normal; line-height: 1; }
.em img.ic { width: 1em; height: 1em; transform: scale(1.22); object-fit: contain; vertical-align: -0.12em; display: inline-block; pointer-events: none; }

.hud { position: fixed; left: 0; right: 0; top: var(--vt, 0px); height: var(--vh, 100%); box-sizing: border-box; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 14px) calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; }
.hud > * { pointer-events: auto; }

.title-card { grid-column: 1; align-self: start; justify-self: start; background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 10px 16px 10px 10px; display: flex; gap: 12px; align-items: center; border: 0; text-align: left; max-width: 100%; min-width: 0; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; font-size: 28px; flex: none; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
.title-text { display: grid; gap: 4px; min-width: 0; }
.title-text b { font-weight: 900; font-size: 17px; letter-spacing: 1px; }
.title-meta { font-size: 14px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.title-meta .em { font-size: 18px; }
.title-meta b { color: var(--accent); font-family: var(--f-num); font-size: 15px; }
.grade { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 9px; font-weight: 700; font-size: 13px; }
.coins { display: inline-flex; align-items: center; gap: 3px; background: var(--gold-soft); border-radius: 999px; padding: 1px 9px 1px 5px; }
.coins b { color: #a86a00 !important; }
.exp-row { display: flex; align-items: center; gap: 6px; }
.exp { height: 9px; width: 140px; max-width: 100%; border-radius: 6px; background: var(--line); overflow: hidden; }
.exp i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--accent)); width: 0; transition: width .6s; }

.menu { grid-column: 2; grid-row: 1 / 3; display: flex; flex-direction: column; gap: 8px; align-self: start; min-height: 0; max-height: 100%; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: 2px 4px 8px; margin: -2px -4px 0; }
.menu::-webkit-scrollbar { display: none; }
.quest-chip { grid-column: 1; grid-row: 2; align-self: start; justify-self: start; background: var(--card); border: 0; border-radius: 999px; box-shadow: var(--shadow); padding: 6px 14px 6px 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--ink); margin-top: -4px; }
.quest-chip .em { font-size: 22px; }
.quest-chip.all { background: var(--gold-soft); }
.quest { box-sizing: border-box; }
.quest .chip { flex: none; white-space: nowrap; }
.quest.done { opacity: .65; }
.menu button { background: var(--card); border: 0; border-radius: 16px; box-shadow: var(--shadow); padding: 6px 10px; display: grid; justify-items: center; gap: 1px; min-width: 64px; }
.menu button .em { font-size: 24px; }
.menu button small { font-size: 11px; font-weight: 700; color: var(--muted); }
.menu button.hot { background: var(--accent); }
.menu button.hot small { color: var(--accent-ink); }
.menu button.off { opacity: .5; }
.menu .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.menu .pair button { min-width: 0; padding: 7px 4px; }
.menu .pair button .em { font-size: 20px; }

.bar { grid-column: 1 / 3; grid-row: 3; position: relative; z-index: 2; box-sizing: border-box; justify-self: center; width: min(680px, 100%); background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 10px 12px 12px; display: grid; gap: 8px; }
.bar-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.bar-head .place-ic { font-size: 26px; }
.bar-head b { font-size: 17px; font-weight: 900; letter-spacing: .5px; white-space: nowrap; }
.bar-head span.hint { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.spk { border: 0; background: var(--gold-soft); border-radius: 50%; width: 38px; height: 38px; font-size: 20px; flex: none; display: grid; place-items: center; margin-left: auto; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.act { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 18px; padding: 8px 12px 7px; min-width: 76px; display: grid; justify-items: center; gap: 3px; box-shadow: 0 3px 0 rgba(0,0,0,.14); transition: transform .08s; }
.act:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.14); }
.act .em { font-size: 30px; }
.act .tx { font-size: 13px; font-weight: 700; }
.act.ghost { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 rgba(0,0,0,.06); }
.act.gold { background: var(--gold); color: var(--ink); }
.act.wide { display: flex; align-items: center; gap: 8px; }
.act:disabled { opacity: .4; cursor: default; }

.labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag { position: absolute; left: 0; top: 0; pointer-events: auto; display: flex; align-items: center; gap: 6px; background: var(--card); border: 2.5px solid var(--accent); color: var(--ink); border-radius: 999px; padding: 3px 12px 3px 3px; font-size: 14px; font-weight: 700; white-space: nowrap; box-shadow: 0 3px 10px rgba(20,30,60,.2); }
.tag .em { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; font-size: 19px; }
.tag { transition: opacity .35s; }
.tag.far { opacity: 0; pointer-events: none; }
.tag.small { border-width: 0; padding: 2px 9px; font-size: 12px; font-weight: 500; background: rgba(251,249,252,.88); pointer-events: none; }
.tag.visitor { border-color: var(--gold); }
.tag.visitor .em { background: var(--gold-soft); }
.tag .price-tag { font-family: var(--f-num); font-size: 12px; color: #a86a00; background: var(--gold-soft); border-radius: 999px; padding: 0 7px; margin-left: 2px; }
.tag.locked { border-style: dashed; border-color: var(--gold); background: rgba(251,249,252,.85); }
.tag.locked .em { background: var(--gold-soft); }
.labels.placing .tag:not(.pin) { opacity: .35; pointer-events: none; }
.tag.pin { z-index: 2; border-color: var(--gold); font-family: var(--f-num); font-size: 18px; padding-right: 14px; animation: pin 1s ease-in-out infinite alternate; }
@keyframes pin { to { margin-top: -6px; } }
.tag.next { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(242,184,75,.45), 0 3px 10px rgba(20,30,60,.2); }

.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 96px); transform: translate(-50%, -20px); opacity: 0; background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: 15px; font-weight: 500; transition: .35s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; z-index: 30; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

.sheet-wrap { position: fixed; inset: 0; background: rgba(15, 22, 45, .45); display: grid; place-items: end center; z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px); }
@media (min-width: 700px) { .sheet-wrap { place-items: center; } }
.sheet { background: var(--paper); border-radius: 26px; width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 18px; box-shadow: var(--shadow); display: grid; grid-auto-rows: max-content; align-content: start; gap: 14px; -webkit-overflow-scrolling: touch; user-select: text; -webkit-user-select: text; box-sizing: border-box; }
.sheet h2 { margin: 0; font-size: 21px; font-weight: 900; letter-spacing: 1px; text-wrap: balance; }
.sheet p { margin: 0; line-height: 1.65; }
.sheet .sub { color: var(--muted); font-size: 14px; }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head > div { flex: 1; min-width: 0; }
.sheet-head .spk { margin-left: 0; }
.x { border: 0; background: var(--line); width: 40px; height: 40px; border-radius: 50%; font-size: 20px; flex: none; }
.big-ic { font-size: 64px; text-align: center; }
.scene { position: relative; width: min(100%, 64vh, 64dvh); justify-self: center; flex: none; border-radius: 18px; overflow: hidden; background: #e8eef0; box-shadow: inset 0 0 0 2px var(--line); }
.scene::before { content: ''; display: block; padding-top: 56.25%; }
.scene img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.scene.ph > .em { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.scene.ph { background: linear-gradient(160deg, #cfe9f7, #f6efd9 70%, #d7ecc6); }
.scene.ph.dusk { background: linear-gradient(160deg, #f7c59f, #e9a7b9 55%, #b9a3d6); }
.scene.ph.night { background: linear-gradient(160deg, #1f2a55, #3a3a78 60%, #5b4a8a); }
.scene.ph.dawn { background: linear-gradient(160deg, #ffe0b8, #fff3d6 60%, #cfe9f7); }
.scene.ph .em { font-size: 84px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.18)); }
.scene.ph small { position: absolute; right: 10px; bottom: 6px; font: 11px/1 ui-monospace, monospace; color: rgba(42,45,68,.45); }
.scene.ph.night small { color: rgba(255,255,255,.5); }
.scene-tx { text-align: center; font-size: 18px; margin: 4px 0; }
.pond { position: relative; height: 200px; border-radius: 18px; background: radial-gradient(ellipse at 50% 55%, #9fd3dc, #5fa3b5 70%, #4b8ea2); overflow: hidden; }
.pond .bob { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); font-size: 30px; }
.pond.wait .bob { animation: bob 1.1s ease-in-out infinite; }
.pond.bite .bob { font-size: 46px; animation: bite .25s ease-in-out infinite alternate; }
.pond .ripple { position: absolute; left: 50%; top: 52%; width: 70px; height: 22px; margin-left: -35px; border: 2px solid rgba(255,255,255,.6); border-radius: 50%; }
.pond.idle .ripple { opacity: 0; }
.pond .got { position: relative; display: inline-block; font-size: 34px; margin: 8px 0 0 10px; }
@keyframes bob { 50% { transform: translate(-50%, -38%); } }
@keyframes bite { to { transform: translate(-50%, -20%) scale(1.15); } }
.act.big { font-size: 22px; padding: 14px 34px; }
.memo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.mcard { height: clamp(56px, 12vh, 112px); border-radius: 16px; border: 0; background: var(--accent); font-size: 38px; display: grid; place-items: center; box-shadow: 0 4px 0 rgba(0,0,0,.15); cursor: pointer; }
.mcard.up { background: #fff; box-shadow: inset 0 0 0 3px var(--line); }
.mcard.done { background: var(--gold-soft); opacity: .8; }
.moles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.hole { height: clamp(64px, 13vh, 120px); border-radius: 50%; border: 0; background: radial-gradient(ellipse at 50% 70%, #5a3a26 40%, #8dbb72 42%); font-size: 46px; display: grid; place-items: center; cursor: pointer; touch-action: manipulation; }
.hole.up .em { animation: pop .15s ease-out; }
@keyframes pop { from { transform: translateY(30%) scale(.6); } }
.timebar { height: 12px; border-radius: 99px; background: var(--line); overflow: hidden; }
.timebar i { display: block; height: 100%; background: var(--gold); transition: width 1s linear; }
.story-page { display: grid; place-items: center; gap: 8px; min-height: 220px; background: #fffaf0; border-radius: 18px; box-shadow: inset 0 0 0 2px var(--line); padding: 18px; }
.story-page .em { font-size: 96px; }
.story-page p { font-size: 22px; text-align: center; margin: 0; line-height: 1.5; }
.cone { position: relative; height: 230px; display: grid; place-items: end center; }
.cone > .cn { font-size: 0; width: 0; height: 0; border-left: 34px solid transparent; border-right: 34px solid transparent; border-top: 80px solid #e2a65c; margin-bottom: 0; }
.cone i { position: absolute; left: 50%; width: 78px; height: 62px; margin-left: -39px; border-radius: 50% 50% 44% 44%; box-shadow: inset -6px -6px 0 rgba(0,0,0,.08); }
.cone.small { height: 150px; transform: scale(.75); transform-origin: bottom center; margin-top: -20px; }
.order { display: flex; align-items: center; justify-content: center; gap: 10px; }
.order .who { font-size: 54px; }
.order .bubble { background: #fff; border-radius: 22px; padding: 10px 14px; display: flex; align-items: center; gap: 8px; box-shadow: inset 0 0 0 3px var(--line); font-size: 28px; }
.order .bubble i { width: 34px; height: 34px; border-radius: 50%; display: inline-block; box-shadow: inset -3px -3px 0 rgba(0,0,0,.1), 0 0 0 2px rgba(0,0,0,.08); }
.cwrap { display: grid; place-items: center; }
.cpic { width: min(300px, 70vw); height: auto; border-radius: 18px; background: #fff; touch-action: manipulation; }
.cpic [data-r] { cursor: pointer; }
.cthumb { width: 76px; height: 76px; border-radius: 12px; }
.scene-tx .cthumb { width: 120px; height: 120px; }
.palette { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }
.palette .sw { width: 44px; height: 44px; border-radius: 50%; border: 0; box-shadow: inset 0 0 0 2px rgba(0,0,0,.12); display: grid; place-items: center; font-size: 22px; padding: 0; }
.palette .sw.era { background: #fff; }
.palette .sw.on { box-shadow: 0 0 0 4px var(--accent), inset 0 0 0 2px rgba(0,0,0,.12); transform: scale(1.08); }
.cdots { display: flex; gap: 3px; justify-content: center; }
.cdots i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.recipe { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.recipe > span { background: #fff; border-radius: 14px; padding: 4px 8px; display: flex; align-items: center; gap: 4px; font-size: 26px; box-shadow: inset 0 0 0 2px var(--line); opacity: .75; }
.recipe > span b { font-size: 13px; color: var(--muted); }
.recipe > span.now { box-shadow: inset 0 0 0 3px var(--accent); opacity: 1; transform: scale(1.08); }
.recipe > span.done { background: var(--gold-soft); opacity: 1; }
.plate { margin: 10px auto 0; width: 220px; min-height: 64px; border-radius: 50%; background: #fff; box-shadow: inset 0 -6px 0 rgba(0,0,0,.06), 0 0 0 4px #eef0f6; display: grid; place-items: center; font-size: 34px; letter-spacing: -6px; }
.tile.shake { animation: shake .35s; }
.cone b { position: absolute; left: 50%; transform: translateX(-50%); font-size: 30px; }
.tile .dot { width: 40px; height: 40px; border-radius: 50%; display: inline-block; }
.tag[hidden] { display: none !important; }
.lvcard { display: flex; align-items: center; gap: 12px; background: var(--gold-soft); border-radius: 18px; padding: 10px 14px; border: 0; width: 100%; text-align: left; font: inherit; cursor: pointer; }
.lvcard .em { font-size: 40px; }
.lvcard b { display: block; font-size: 17px; }
.lvcard small { color: var(--ink-soft, #555); }
.result { text-align: center; display: grid; gap: 6px; }
.result .score { font-family: var(--f-num); font-size: 56px; font-weight: 700; color: var(--accent); }

.choices { display: grid; gap: 8px; }
.choice { border: 0; text-align: left; padding: 12px 14px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); font-size: 16px; }
.choice.right, .pchoice.right { box-shadow: inset 0 0 0 3px var(--leaf); background: var(--leaf-soft); }
.choice.wrong, .pchoice.wrong { box-shadow: inset 0 0 0 3px var(--accent); background: var(--accent-soft); }
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pchoice { border: 0; background: #fff; border-radius: 20px; box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 rgba(0,0,0,.06); min-height: 96px; display: grid; place-items: center; font-size: 52px; padding: 8px; font-family: var(--f-emoji); }
.pchoice svg { width: 64px; height: 64px; }
.pchoice .num { font-family: var(--f-num); font-size: 54px; font-weight: 700; color: var(--ink); }
.pchoice .zy { font-family: var(--f-display); font-size: 56px; font-weight: 700; color: var(--ink); }
.pchoice .abc { font-family: var(--f-num); font-size: 58px; font-weight: 700; color: var(--ink); }
.pchoice.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.pic-show { background: #fff; border-radius: 20px; padding: 14px; display: flex; flex-wrap: wrap; gap: 8px 10px; justify-content: center; align-items: center; font-size: 38px; box-shadow: inset 0 0 0 2px var(--line); min-height: 60px; font-family: var(--f-emoji); }
.pic-show .word { font-family: var(--f-num); font-size: 44px; font-weight: 700; color: var(--accent); }
.pic-show .wordzh { font-family: var(--f-display); font-size: 24px; font-weight: 700; color: var(--ink); }
.pic-show .swatch { width: 84px; height: 84px; border-radius: 50%; box-shadow: inset 0 -6px 0 rgba(0,0,0,.15); }
.pic-show .q { font-family: var(--f-num); font-size: 40px; color: var(--accent); font-weight: 700; }
.pic-show .op { font-family: var(--f-num); font-size: 40px; color: var(--accent); font-weight: 700; padding: 0 4px; }
.pic-show .gone { opacity: .3; filter: grayscale(1); position: relative; }
.pic-show .listen { border: 0; background: var(--gold-soft); border-radius: 50%; width: 76px; height: 76px; font-size: 40px; display: grid; place-items: center; }
.fact { background: var(--gold-soft); border-radius: 14px; padding: 12px 14px; line-height: 1.6; }
.fact b { color: #a86a00; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 0; padding: 8px 14px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.tiles.big { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tiles.big .tile { padding: 14px 4px 10px; }
.tiles.big .tile .em, .tiles.big .tile .zyic { font-size: 44px; }
.tile { border: 0; background: #fff; border-radius: 18px; padding: 10px 4px 8px; display: grid; justify-items: center; gap: 4px; box-shadow: inset 0 0 0 2px var(--line); min-width: 0; }
.tile .em { font-size: 34px; }
.tile .zyic { font-size: 34px; font-weight: 900; color: var(--accent); line-height: 1; }
.tile small { font-size: 12px; font-weight: 700; color: var(--muted); }
.tile .price { font-family: var(--f-num); font-size: 13px; font-weight: 700; color: #a86a00; background: var(--gold-soft); border-radius: 999px; padding: 1px 8px; }
.tile .price.own { color: var(--leaf); background: var(--leaf-soft); }
.tile[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 3px var(--accent); }
.tile[aria-pressed="true"] small { color: var(--accent); }
.tile.dim { opacity: .55; }
.swatch-tile { width: 40px; height: 40px; border-radius: 12px; box-shadow: inset 0 0 0 2px rgba(0,0,0,.08); }
.field { display: grid; gap: 6px; }
.field > span, .label { font-size: 14px; font-weight: 700; color: var(--muted); letter-spacing: .5px; display: flex; gap: 6px; align-items: center; }

function syncCoins() {
  if (coinFor === S.day && coinG.children.length === coinsLeft()) return;
  coinFor = S.day; while (coinG.children.length) coinG.remove(coinG.children[0]);
  if (visiting) return;

  const seq = COIN_SPOTS.map((p, k) => [p, (k * 7 + S.day * 5) % COIN_SPOTS.length]).sort((a, b) => a[1] - b[1]).slice(0, COINS_PER_DAY);

function startRide(kind) {

function stepRide(dt, t) {
  ride.t += dt; const k = Math.min(1, ride.t / ride.dur);
  if (ride.kind === 'slide') {
    const a = parkAnim.slide, u = k < .35 ? 0 : (k - .35) / .65;
    player.position.lerpVectors(a.top, a.bottom, Math.min(1, u * u * 1.4)); player.rotation.y = 0;
  } else if (ride.kind === 'swing') {
    const s = parkAnim.swings[0], wp = new THREE.Vector3(0, -2.25, 0); s.localToWorld(wp);
    player.position.set(wp.x, wp.y - .55, wp.z); player.rotation.y = Math.PI / 2;
  } else {
    const a = t * .6 + 0, r = 1.8, c = new THREE.Vector3(-31, 1, 2);
    player.position.set(c.x + Math.cos(-a) * r, .95 + Math.sin(t * 4) * .15, c.z + Math.sin(-a) * r); player.rotation.y = a + Math.PI;
  }
  if (k >= 1) { const kind = ride.kind; player.position.copy(ride.back); player.position.y = 0; ride = null; sceneCard(`park-${kind}`, { slide: '溜滑梯', swing: '盪鞦韆', carousel: '旋轉木馬' }[kind], pick(['😆 好好玩！再玩一次', '🎉 玩得好開心'])); }

const myWordList = () => (S.myWords || []).map(x => [x.w, x.ic, x.zh || '']);
function listenQ(w) {
  const pool = [...myWordList(), ...EN].filter(x => x[0] !== w[0]);
  const near = shuffle(pool.filter(x => x[0][0] === w[0][0] || Math.abs(x[0].length - w[0].length) <= 1));
  const others = [...near, ...shuffle(pool)].filter((x, i, a) => a.findIndex(y => y[0] === x[0]) === i).slice(0, 3);
  return { listenOnly: true, say: [{ t: '聽考！聽聽看，是哪一個字？' }, { t: w[0], lang: 'en' }], listen: [{ t: w[0], lang: 'en' }],
    show: `<button class="listen" data-listen>${E('🔊')}</button><span class="wordzh">聽一聽，選出拼字</span>`,
    options: shuffle([w, ...others]).map(x => ({ html: `<span class="wopt">${esc(x[0])}</span>`, ok: x === w })), sticker: w[1], praise: [{ t: '答對了！' }, { t: w[0], lang: 'en' }, { t: w[2] || '' }] };
}
function spellQ(w) {
  return { spell: true, word: w[0], ic: w[1], zh: w[2] || '', say: [{ t: '拼字！' }, { t: w[0], lang: 'en' }, { t: '要怎麼拼？' }], listen: [{ t: w[0], lang: 'en' }],
    sticker: w[1], praise: [{ t: '拼對了！' }, { t: w[0].split('').filter(c => /[a-z]/i.test(c)).join(', '), lang: 'en' }, { t: w[0], lang: 'en' }] };
}
function englishTestPlan(n) {
  const mine = shuffle(myWordList()), base = shuffle(EN.filter(x => x[0].length <= 5));
  const words = [...mine, ...base].filter((x, i, a) => a.findIndex(y => y[0] === x[0]) === i).slice(0, n);
  return words.map((w, i) => i % 2 === 0 && i < 4 ? listenQ(w) : spellQ(w));

// renders a spelling question into the open sheet; done(firstTryRight) fires once it is finished
function renderSpell(title, sub, q, test, done) {
  const word = q.word, chars = word.split(''), needs = chars.map(c => /[a-z]/i.test(c));
  const decoys = shuffle('abcdefghijklmnoprstuwy'.split('').filter(c => !word.includes(c))).slice(0, word.length > 6 ? 1 : 2);
  const tiles = shuffle([...chars.filter(c => /[a-z]/i.test(c)), ...decoys]);
  openSheet(head(title, sub) +
    `<div class="pic-show"><span style="font-size:64px">${q.ic}</span><button class="listen" data-listen>${E('🔊')}</button>${q.zh ? `<span class="wordzh">${esc(q.zh)}</span>` : ''}</div>
     <div class="slots">${chars.map((c, i) => needs[i] ? `<span class="slot" data-s="${i}"></span>` : `<span class="slot fixed">${c === ' ' ? '&nbsp;' : esc(c)}</span>`).join('')}</div>
     <div class="ltrs">${tiles.map((c, i) => `<button class="ltr" data-t="${i}">${c}</button>`).join('')}</div>
     <div class="row" style="justify-content:center">${test ? '' : `<button class="act ghost" id="sHint">${E('💡')}<span class="tx">提示</span></button>`}<button class="act ghost" id="sBack">${E('⌫')}<span class="tx">擦掉</span></button></div>`, q.say);
  bindListen(q);
  const filled = []; let tried = false, over = false;
  const slots = [...sheet.querySelectorAll('.slot[data-s]')], tileEls = [...sheet.querySelectorAll('.ltr')];
  const draw = () => slots.forEach((s, k) => { const f = filled[k]; s.textContent = f ? tiles[f.t] : ''; s.classList.toggle('on', !!f); s.classList.toggle('hinted', !!(f && f.hint)); });
  const target = chars.filter(c => /[a-z]/i.test(c));
  const check = () => {
    if (filled.length < target.length) return;
    const ok = filled.every((f, k) => tiles[f.t] === target[k]);
    if (ok) { over = true; slots.forEach(s => s.classList.add('right')); tileEls.forEach(b => b.disabled = true); sfx('right'); say(q.praise); return done(!tried); }
    if (test) {
      over = true; tileEls.forEach(b => b.disabled = true); sfx('wrong');
      slots.forEach((s, k) => { s.textContent = target[k]; s.classList.add(tiles[filled[k].t] === target[k] ? 'right' : 'fix'); });
      say([{ t: '答案是' }, { t: target.join(', '), lang: 'en' }, { t: word, lang: 'en' }]); return done(false);
    }
    tried = true; sfx('wrong'); say('再試一次');
    const box = sheet.querySelector('.slots'); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    // keep the letters that were already right at the start, give the rest back
    let keep = 0; while (keep < filled.length && tiles[filled[keep].t] === target[keep]) keep++;
    setTimeout(() => { while (filled.length > keep) { const f = filled.pop(); tileEls[f.t].disabled = false; } draw(); }, 600);
  };
  tileEls.forEach(b => b.addEventListener('click', () => {
    if (over || filled.length >= target.length) return;
    filled.push({ t: +b.dataset.t }); b.disabled = true; sfx('pop'); say([{ t: tiles[+b.dataset.t], lang: 'en' }]); draw(); check();
  }));
  $('#sBack').addEventListener('click', () => { if (over || !filled.length) return; const f = filled.pop(); tileEls[f.t].disabled = false; sfx('pop'); draw(); });
  const h = $('#sHint'); if (h) h.addEventListener('click', () => {
    if (over) return;
    while (filled.length && tiles[filled[filled.length - 1].t] !== target[filled.length - 1]) { const f = filled.pop(); tileEls[f.t].disabled = false; }
    let k = 0; while (k < filled.length && tiles[filled[k].t] === target[k]) k++;
    if (k >= target.length) return;
    const ti = tileEls.findIndex((b, i) => !b.disabled && tiles[i] === target[k]); if (ti < 0) return;
    tried = true; filled.push({ t: ti, hint: true }); tileEls[ti].disabled = true; say([{ t: target[k], lang: 'en' }]); draw(); check();
  });
}

function startTest(kind) {

  const name = subjName(kind), total = 5, plan = kind === 'english' ? englishTestPlan(total) : null;
  let i = 0, right = 0;

    openSheet(head(`${name}考試${q.listenOnly ? '・聽考' : ''}`, `第 ${i + 1} / ${total} 題・答對 ${right} 題`) +
      `<div class="pic-show">${q.show}</div><div class="pgrid">${q.options.map((o, k) => `<button class="pchoice" data-k="${k}">${o.html}</button>`).join('')}</div>`, q.say);

    }));
  };

    const pass = right >= 3, pts = pass ? right * 10 + (right === total ? 20 : 0) : 0;
    if (pass && supplyBonus()) { S.points += supplyBonus(); toast(`🎒 書包裡的文具加分 🪙+${supplyBonus()}`, false); }

      `<div class="result">${pass ? sceneHTML('school-pass') : '<div class="big-ic em">💪</div>'}<div class="score">${right} / ${total}</div>
       <p>${pass ? `拿到 ${E('🪙')} <b>${pts}</b> 積分！現在有 ${S.points} 積分。<br>回家就可以換玩具和家具。` : '答對 3 題才通過。先去上課練習，再來挑戰！'}</p>
       <p class="sub">今天還可以考 ${testsLeft()} 次</p></div>
       <div class="row">${pass ? `<button class="act gold" id="goHome">${E('🏠')}<span class="tx">回家換禮物</span></button>` : `<button class="act gold" id="practice">${E('📝')}<span class="tx">去練習</span></button>`}<button class="act" id="ok">${E('👍')}<span class="tx">好</span></button></div>`,
      pass ? `考試通過！答對 ${right} 題，拿到 ${pts} 積分！${right === total ? '全部答對，太厲害了！' : ''}` : `答對 ${right} 題，差一點點！先去練習，再來挑戰`);

    const pr = $('#practice'); if (pr) pr.addEventListener('click', () => startLesson(kind));
  };

}
function startClass(subj) {
  let pool = Q.filter(q => q[1] === subj && !S.learned.includes(q[0]));
  if (!pool.length) pool = Q.filter(q => q[1] === subj);
  const qs = shuffle(pool).slice(0, 3); let i = 0, right = 0;
  const next = () => {
    if (i >= qs.length) return finish();
    const [id, , text, opts, fact] = qs[i], order = shuffle(opts);
    openSheet(head(`${SUBJECTS[subj]}問答`, `第 ${i + 1} / ${qs.length} 題`) +
      `<p style="font-size:19px;font-weight:700">${esc(text)}</p><div class="choices">${order.map(o => `<button class="choice">${esc(o)}</button>`).join('')}</div><div id="after"></div>`, text);
    const btns = sheet.querySelectorAll('.choice');
    btns.forEach(b => b.addEventListener('click', () => {
      const ok = b.textContent === opts[0];
      btns.forEach(x => { x.disabled = true; if (x.textContent === opts[0]) x.classList.add('right'); });
      if (!ok) b.classList.add('wrong');
      sfx(ok ? 'right' : 'wrong');
      if (ok) { right++; if (!S.learned.includes(id)) S.learned.push(id); }
      $('#after').innerHTML = `<div class="fact"><b>${ok ? '答對了！得到知識卡' : '沒關係，一起來學'}</b><br>${esc(fact)}</div><div class="row" style="margin-top:12px"><button class="act" id="nextQ">${E('👉')}<span class="tx">${i + 1 < qs.length ? '下一題' : '下課'}</span></button></div>`;
      say((ok ? '答對了！' : '沒關係，一起來學。') + fact);
      $('#nextQ').addEventListener('click', () => { i++; next(); });
    }));
  };
  const finish = () => {
    gainExp(20 + right * 15); advanceTime();
    openSheet(head('下課囉！', '') + `<p>答對 <b>${right}</b> 題。</p><div class="row"><button class="act" id="ok">${E('👍')}<span class="tx">好</span></button></div>`, `下課囉！答對 ${right} 題`);
    $('#ok').addEventListener('click', closeSheet);
  };
  next();
}

function buy(id, tab, owner) {
  const o = owner || S, s = shopItem(id), own = o.owned.includes(id);
  if (own) {
    if (s.cat === 'wall') { roomStyle(o).wall = id; save(); syncRoom(); openShop(tab, owner); say(`換成${s.name}`); return; }
    if (s.cat === 'floor') { roomStyle(o).floor = id; save(); syncRoom(); openShop(tab, owner); say(`換成${s.name}`); return; }
    say(`${s.name}已經在房間裡了`); return;
  }

  if (S.points < s.price) { sfx('wrong'); say(`${s.name}要 ${s.price} 積分，還差 ${s.price - S.points} 積分，去學校考試吧！`); toast(`🪙 還差 ${s.price - S.points} 積分`, false); return; }

    S.points -= s.price; o.owned.push(id);

  });
}

function starSVG(id) {
  const a = STAR_ART[id];
  let s = `<svg class="starsky" viewBox="0 0 100 100"><rect width="100" height="100" rx="10" fill="#101c3a"/>`;
  for (let i = 0; i < 26; i++) s += `<circle cx="${(i * 37) % 100}" cy="${(i * 53 + 11) % 100}" r=".5" fill="#8ea3d6"/>`;
  if (a.moon) s += `<circle cx="50" cy="52" r="26" fill="#f2efe2"/><circle cx="40" cy="44" r="5" fill="#d9d4c2"/><circle cx="58" cy="60" r="7" fill="#d9d4c2"/><circle cx="60" cy="40" r="3" fill="#d9d4c2"/><circle cx="42" cy="64" r="3.5" fill="#d9d4c2"/>`;
  if (a.meteor) s += `<defs><linearGradient id="mt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><path d="M18 18 L70 58" stroke="url(#mt)" stroke-width="2.4" stroke-linecap="round"/><circle cx="70" cy="58" r="2.6" fill="#fff6c8"/>`;
  a.lines.forEach(([p, q]) => { s += `<line x1="${a.pts[p][0]}" y1="${a.pts[p][1]}" x2="${a.pts[q][0]}" y2="${a.pts[q][1]}" stroke="#7fa3ff" stroke-width=".8" stroke-dasharray="2 1.5"/>`; });

function setupPad() {
  const c = $('#drawCanvas'), g = c.getContext('2d');
  if (!c.dataset.ready) { g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); c.dataset.ready = '1'; }
  let pen = '#2a2d44', last = null;
  g.lineCap = g.lineJoin = 'round';
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * c.width, (e.clientY - r.top) / r.height * c.height]; };
  c.onpointerdown = e => { c.setPointerCapture(e.pointerId); last = pos(e); g.fillStyle = pen; g.beginPath(); g.arc(last[0], last[1], pen === '#ffffff' ? 14 : 5, 0, 7); g.fill(); };
  c.onpointermove = e => { if (!last) return; const p = pos(e); g.strokeStyle = pen; g.lineWidth = pen === '#ffffff' ? 28 : 10; g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(p[0], p[1]); g.stroke(); last = p; };
  c.onpointerup = c.onpointercancel = () => { last = null; };
  sheet.querySelectorAll('[data-pen]').forEach(b => b.onclick = () => { pen = b.dataset.pen; sfx('pop'); sheet.querySelectorAll('[data-pen]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#clearPad').onclick = () => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); sfx('pop'); };
  $('#usePad').onclick = async () => {
    const src = { naturalWidth: c.width, naturalHeight: c.height, el: c };
    draftPhoto = { blob: await scaleTo(src, 960, .88, 'blob'), medium: await scaleTo(src, 480, .8, 'url'), thumb: await scaleTo(src, 200, .75, 'url') };
    const prev = $('#photoPrev'); prev.src = draftPhoto.thumb; prev.hidden = false;
    $('#pad').hidden = true; sfx('sticker'); say('畫好了！');
  };
}
$('#photoInput').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const img = await loadImage(file);
    draftPhoto = { blob: await scaleTo(img, 1280, .85, 'blob'), medium: await scaleTo(img, 640, .72, 'url'), thumb: await scaleTo(img, 200, .7, 'url') };
    const prev = $('#photoPrev'); if (prev) { prev.src = draftPhoto.thumb; prev.hidden = false; }
    sfx('sticker');
  } catch (err) { toast('📷 這張照片打不開，換一張試試'); }
});
function loadImage(file) { return new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = u; }); }
function scaleTo(img, max, q, as) {
  const w0 = img.naturalWidth, h0 = img.naturalHeight, s = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement('canvas'); c.width = Math.round(w0 * s); c.height = Math.round(h0 * s);
  const g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img.el || img, 0, 0, c.width, c.height);
  if (as === 'url') return Promise.resolve(c.toDataURL('image/jpeg', q));
  return new Promise(r => c.toBlob(r, 'image/jpeg', q));
}
async function addJournal(entry) {
  if (!current || visiting) return;
  if (cloud.db && cloud.ready) {
    try {
      const ref = await cloud.db.collection(journalCol(current.id)).add(entry);
      if (!journal.some(j => j.id === ref.id)) journal.push(Object.assign({ id: ref.id }, entry));
      syncWorld(); refreshHUD(); return;
    } catch (e) { console.warn('journal add', e); }
  }
  journal.push(Object.assign({ id: 'l' + Date.now(), local: true }, entry));
  saveJournalLocal(); syncWorld(); refreshHUD();
}

async function hashPin(pin, salt) {
  const txt = salt + ':' + pin;
  try { const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 5381; for (const c of txt) h = (h * 33 + c.charCodeAt(0)) >>> 0; return 'h' + h.toString(16); }
}
function saveProfilesLocal() { try { localStorage.setItem(LS_PROFILES, JSON.stringify(profiles)); } catch (e) {} }
async function loadProfiles() {
  let local = [];
  try { local = JSON.parse(localStorage.getItem(LS_PROFILES)) || []; } catch (e) {}
  if (cloud.db) {
    try {
      const snap = await cloud.db.collection('profiles').get();
      profiles = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      if (!profiles.length) {
        const legacy = await cloud.db.doc('island/state').get();
        if (legacy.exists) { const d = legacy.data(); const p = { id: 'main', name: d.playerName || 'Melissa', avatar: 'av1', pinHash: null, salt: '', createdAt: Date.now(), day: d.day || 1 }; profiles = [p]; await putProfile(p); }
      }
    } catch (e) { console.warn('profiles', e); profiles = local; }
  } else {
    profiles = local;
    if (!profiles.length) { try { const s = JSON.parse(localStorage.getItem(LS_STATE)); if (s && s.v) profiles = [{ id: 'main', name: s.playerName || 'Melissa', avatar: 'av1', pinHash: null, salt: '', createdAt: Date.now(), day: s.day || 1 }]; } catch (e) {} }
  }
  saveProfilesLocal(); profilesReady = true;
  if (!$('#start').hidden) renderStart();
}
async function putProfile(p) {
  const i = profiles.findIndex(q => q.id === p.id); if (i >= 0) profiles[i] = p; else profiles.push(p);
  saveProfilesLocal();
  if (cloud.db) { const { id, ...body } = p; try { await cloud.db.doc('profiles/' + id).set(JSON.parse(JSON.stringify(body))); } catch (e) { console.warn('profile save', e); } }
}
async function readIsland(id) {
  let st = null, jr = [];
  if (cloud.db) {
    try { const s = await cloud.db.doc(stateDoc(id)).get(); if (s.exists) st = s.data(); } catch (e) {}
    try { const q = await cloud.db.collection(journalCol(id)).orderBy('createdAt', 'asc').get(); jr = q.docs.map(d => Object.assign({ id: d.id }, d.data())); } catch (e) {}
  }
  try { const ls = JSON.parse(localStorage.getItem(lsState(id))); if (ls && ls.v && (!st || (ls.updatedAt || 0) > (st.updatedAt || 0))) st = ls; } catch (e) {}
  try { const lj = JSON.parse(localStorage.getItem(lsJournal(id))); if (Array.isArray(lj)) jr = jr.concat(lj); } catch (e) {}
  return { st, jr };
}
function rebuildWorld() {
  EXPANSIONS.forEach(e => { if (!hasExp(e.id) && expGroups.has(e.id)) { scene.remove(expGroups.get(e.id)); expGroups.delete(e.id); } });
  for (const g of roomItems.values()) { room.remove(g); const k = roomPick.indexOf(g); if (k >= 0) roomPick.splice(k, 1); }
  roomItems.clear();
  if (mode === 'in') exitHome();
  syncWorld(); syncExpansions(); buildCastle();
  dressHero(player, visiting && ownS ? ownS.outfit : null); if (kidIn) dressHero(kidIn, visiting && ownS ? ownS.outfit : null);
  syncRoom(); applyPeriod(); refreshHUD();
}
async function loginTo(p) {
  const { st, jr } = await readIsland(p.id);
  S = st ? mergeState(JSON.parse(JSON.stringify(st))) : Object.assign(DEFAULT_STATE(), { playerName: p.name });
  journal = jr; current = p; visiting = null;
  if (journalUnsub) { try { journalUnsub(); } catch (e) {} journalUnsub = null; }
  if (cloud.db) {
    for (const j of journal.filter(j => j.local)) { try { const { id, local, ...body } = j; await cloud.db.collection(journalCol(p.id)).add(body); journal = journal.filter(x => x !== j); } catch (e) {} }
    saveJournalLocal();
    try {
      journalUnsub = cloud.db.collection(journalCol(p.id)).orderBy('createdAt', 'asc').onSnapshot(snap => {
        const fresh = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
        if (visiting) { ownJournal = fresh.concat((ownJournal || []).filter(j => j.local)); return; }
        journal = fresh.concat(journal.filter(j => j.local)); syncWorld(); syncRoom(); refreshHUD();

}

let firstPin = '';
let adultQ = [0, 0];
async function pinKey(d) {
  if (d === 'back') { pinBuf = pinBuf.slice(0, -1); sfx('pop'); renderStart(); return; }
  if (startView === 'adult') {
    if (d !== 'ok') { if (pinBuf.length < 4) { pinBuf += d; sfx('step'); } renderStart(); return; }
    if (parseInt(pinBuf, 10) !== adultQ[0] * adultQ[1]) { sfx('wrong'); say('答案不對'); pinBuf = ''; startView = 'pin'; renderStart(); return; }
    pinBuf = ''; startView = 'setpin'; renderStart(); say('請設定新的密碼'); return;
  }
  if (d !== 'ok') { if (pinBuf.length < 4) { pinBuf += d; sfx('step'); } renderStart(); if (pinBuf.length < 4) return; }
  if (pinBuf.length < 4) { sfx('wrong'); say('密碼要四個數字'); return; }
  if (startView === 'pin') {
    const ok = (await hashPin(pinBuf, pendingProfile.salt)) === pendingProfile.pinHash;
    if (!ok) { sfx('wrong'); say('密碼不對喔，再試一次'); pinBuf = ''; renderStart(); $('#startCard').classList.add('shake'); setTimeout(() => $('#startCard').classList.remove('shake'), 400); return; }
    return enterIsland(pendingProfile);
  }
  if (startView === 'setpin') { firstPin = pinBuf; pinBuf = ''; startView = 'confirm'; renderStart(); say('再輸入一次一樣的密碼'); return; }
  if (pinBuf !== firstPin) { sfx('wrong'); say('兩次不一樣，重新設定'); pinBuf = ''; startView = 'setpin'; renderStart(); return; }
  const salt = Math.random().toString(36).slice(2, 10), pinHash = await hashPin(pinBuf, salt);
  if (pendingProfile) { pendingProfile = Object.assign({}, pendingProfile, { salt, pinHash }); await putProfile(pendingProfile); return enterIsland(pendingProfile); }
  const p = { id: 'i' + Date.now().toString(36) + Math.floor(Math.random() * 1e4), name: newIsland.name, avatar: newIsland.avatar, salt, pinHash, createdAt: Date.now(), day: 1 };
  await putProfile(p); enterIsland(p, true);
}
function adultReset() {
  adultQ = [12 + Math.floor(Math.random() * 20), 6 + Math.floor(Math.random() * 4)];
  pinBuf = ''; startView = 'adult'; sfx('pop'); renderStart(); say('忘記密碼了嗎？請大人幫忙回答這一題');

const ICE_GUESTS = ['🐰', '🐻', '🐱', '🐶', '🐼', '🦊', '🐨', '🐸'];
function openIceShop() {
  if (visitBlock()) return;
  const tok = ++gameTok, N = 3; let i = 0, good = 0, cone = [], top = 3, tries = 0;
  const orders = Array.from({ length: N }, (_, k) => {
    const n = k === 0 ? 1 : k === 1 ? 2 : Math.random() < .5 ? 2 : 3;
    return { who: pick(ICE_GUESTS), scoops: Array.from({ length: n }, () => Math.floor(Math.random() * SCOOPS.length)), top: k === 0 ? 3 : Math.floor(Math.random() * 3) };
  });

  const same = (a, b) => a.length === b.length && [...a].sort().join() === [...b].sort().join();
  const render = (msg, speak) => {
    if (tok !== gameTok) return;
    const o = orders[i];
    const stack = cone.map((c, k) => `<i style="background:${SCOOPS[c][1]};bottom:${58 + k * 34}px"></i>`).join('');
    openSheet(head('冰淇淋店', `第 ${i + 1} / ${N} 位客人・做對 ${good} 個`) +
      `<div class="order"><span class="who em">${o.who}</span><div class="bubble">${o.scoops.map(s => `<i style="background:${SCOOPS[s][1]}" title="${SCOOPS[s][0]}"></i>`).join('')}${TOPS[o.top][0] ? `<span class="em">+ ${TOPS[o.top][0]}</span>` : ''}<button class="spk" id="hear" aria-label="再說一次">${E('🔊')}</button></div></div>
       <p class="scene-tx">${msg}</p>
       <div class="cone small">${stack}${cone.length && TOPS[top][0] ? `<b class="em" style="bottom:${58 + cone.length * 34 + 22}px">${TOPS[top][0]}</b>` : ''}<span class="cn"></span></div>
       <div class="tiles">${SCOOPS.map((s, k) => `<button class="tile" data-c="${k}" ${cone.length >= 3 ? 'disabled' : ''}><span class="dot" style="background:${s[1]}"></span><small>${s[0]}</small></button>`).join('')}</div>
       <div class="tabs">${TOPS.map((t, k) => `<button class="chip" data-t="${k}" aria-pressed="${k === top}">${t[0] ? E(t[0]) : ''} ${t[1]}</button>`).join('')}</div>
       <div class="row" style="justify-content:center"><button class="act ghost" id="undo" ${cone.length ? '' : 'disabled'}>${E('↩️')}<span class="tx">拿掉一球</span></button><button class="act gold" id="serve" ${cone.length ? '' : 'disabled'}>${E('🍨')}<span class="tx">給客人</span></button></div>`,
      speak, () => { gameTok++; });

    sheet.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => { if (cone.length >= 3) return; cone.push(+b.dataset.c); sfx('pop'); say(SCOOPS[+b.dataset.c][0]); render(msg); }));
    sheet.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => { top = +b.dataset.t; sfx('pop'); render(msg); }));
    $('#undo').addEventListener('click', () => { cone.pop(); sfx('pop'); render(msg); });
    $('#serve').addEventListener('click', () => {
      const ok = same(cone, o.scoops) && top === o.top;
      if (!ok) {

      }
      if (tries === 0) good++;

      i++; cone = []; top = 3; tries = 0;
      if (i >= N) return setTimeout(() => tok === gameTok && finish(), 700);
      render(`${orders[i - 1].who} 「謝謝老闆！」下一位客人來了`, `下一位客人。${orderSay(orders[i])}`);
    });
  };
  const finish = () => {
    gameTok++;
    const pts = good >= 2 ? shopPay('ice', 6) : 0; questHit('serve'); gainExp(10); save(); refreshHUD(); sfx(good >= 2 ? 'level' : 'pop');

      { more: `<button class="act ghost" id="again">${E('🔁')}<span class="tx">再開一次店</span></button>` });
    $('#again').addEventListener('click', openIceShop);
  };
  render(`${orders[0].who} 來買冰淇淋了！聽聽看他要什麼`, `客人來了。${orderSay(orders[0])}`);
}
